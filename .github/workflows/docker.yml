name: Build and Push Docker  Images

on:
  push:
    branches:
          - main

jobs:
    docker:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with: 
              username: ${{secrets.DOCKERHUB_USERNAME}}
              password: ${{secrets.DOCKERHUB_TOKEN}}
          
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build and push Client
            uses: docker/build-push-action@v6
            with: 
                context: ./client
                push: true
                build-args: |
                            VITE_CURRENCY=${{secrets.VITE_CURRENCY}}
                            VITE_CLERK_PUBLISHABLE_KEY=${{secrets.VITE_CLERK_PUBLISHABLE_KEY}}
                            VITE_BASE_URL=${{secrets.VITE_BASE_URL}}
                            VITE_TMDB_IMAGE_BASE_URL=${{secrets.VITE_TMDB_IMAGE_BASE_URL}}
                      
                tags: |
                    ${{secrets.DOCKERHUB_USERNAME}}/showtime-client:${{github.sha}}
                    ${{secrets.DOCKERHUB_USERNAME}}/showtime-client:main
            
          - name: Build and push Server
            uses: docker/build-push-action@v6
            with: 
                context: ./server
                push: true
                tags: |
                      ${{secrets.DOCKERHUB_USERNAME}}/showtime-server:${{github.sha}}
                      ${{secrets.DOCKERHUB_USERNAME}}/showtime-server:main
